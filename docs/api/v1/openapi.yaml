openapi: 3.0.3
info:
  title: Video Streaming API
  version: 1.0.0
paths:
  /v1/signup:
    post:
      operationId: signup
      summary: ユーザー登録
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 登録したユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: メールアドレスが登録済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    SignupRequest:
      type: object
      required: [name, email, password]
      # 未知のキーは 400 にする。"Name" のように大文字小文字だけが違うキーで、検証をすり抜けられないようにする
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          # 制御文字と改行にあたる文字は使えない。PostgreSQL は NUL を保存できないため、ここで弾く
          # - \p{Cc}: 制御文字（C0 の U+0000〜U+001F、DEL の U+007F、C1 の U+0080〜U+009F）。NUL、改行、タブ、NEL など
          # - \p{Zl}、\p{Zp}: 行の区切り（U+2028）、段落の区切り（U+2029）
          pattern: '^[^\p{Cc}\p{Zl}\p{Zp}]*$'
          example: taro
        email:
          type: string
          format: email
          maxLength: 254
          # ブラウザの <input type="email">（WHATWG）と同じ形式に、次の 3 点を加えたもの
          # - @ の前は 64 文字まで（RFC 5321）
          # - ドメインに . が 1 つ以上必要（taro@localhost は不可）
          # - @ の前の . は先頭・末尾・連続を不可（RFC 5322）。これは pattern ではなく、
          #   生成コードの Email 型（format: email）が net/mail.ParseAddress で検証する
          # ASCII のみ。日本語や絵文字は使えない。想定するパターンは backend/internal/domain/user.go を参照
          pattern: '^[a-zA-Z0-9.!#$%&''*+/=?^_`{|}~-]{1,64}@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$'
          example: taro@example.com
        password:
          type: string
          # bcrypt は 72 バイトを超える部分を無視するため上限を設ける
          minLength: 8
          maxLength: 72
          example: password123
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
