openapi: 3.0.3
info:
  title: Video Streaming API
  version: 1.0.0
paths:
  /signup:
    post:
      operationId: signup
      summary: ユーザー登録
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 登録したユーザー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: リクエストが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: メールアドレスが登録済み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバー内部のエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    SignupRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: taro
        email:
          type: string
          format: email
          maxLength: 254
          example: taro@example.com
        password:
          type: string
          # bcrypt は 72 バイトを超える部分を無視するため上限を設ける
          minLength: 8
          maxLength: 72
          example: password123
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
